<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1210" viewBox="0 0 1140 1210" role="img" aria-labelledby="title desc">
  <title id="title">dsh-price-less 架构图</title>
  <desc id="desc">分层架构：顶部为用户与 DSH 宿主，向下依次为插件 domains 编排面、core 纯核、platform 适配层（唯一 harness 触点），底部为数据与事实。实线 = 已实现；虚线 = 计划中（P14a/b 手动断面、R3 剪切、R4 压缩）。</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="0" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="arrowPlanned" markerWidth="12" markerHeight="9" refX="0" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 26px system-ui, 'Segoe UI', sans-serif; fill: #0f172a; }
    .subtitle { font: 400 14px system-ui, 'Segoe UI', sans-serif; fill: #64748b; }
    .band-label { font: 700 12.5px system-ui, 'Segoe UI', sans-serif; fill: #64748b; letter-spacing: 0.08em; }
    .box-label { font: 700 14px system-ui, 'Segoe UI', sans-serif; fill: #0f172a; }
    .box-sub { font: 400 11px system-ui, 'Segoe UI', sans-serif; fill: #475569; }
    .box-file { font: 400 10.5px system-ui, 'Segoe UI', sans-serif; font-style: italic; fill: #64748b; }
    .flow-note { font: 400 11px system-ui, 'Segoe UI', sans-serif; font-style: italic; fill: #64748b; }
    .footer { font: 400 12px system-ui, 'Segoe UI', sans-serif; fill: #64748b; }
    .legend-text { font: 400 12.5px system-ui, 'Segoe UI', sans-serif; fill: #334155; }
  </style>

  <!-- ======================= TITLE + LEGEND ======================= -->
  <text class="title" x="40" y="42">dsh-price-less — 架构图</text>
  <text class="subtitle" x="40" y="66">DeepSeek Harness 上下文管理插件 · 已实现 vs 计划中（docs/11-structure.md）</text>

  <rect x="690" y="33" width="22" height="13" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text class="legend-text" x="718" y="44">已实现（P0–P13）</text>
  <rect x="870" y="33" width="22" height="13" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 2"/>
  <text class="legend-text" x="898" y="44">计划中（P14a/b · R3 · R4）</text>

