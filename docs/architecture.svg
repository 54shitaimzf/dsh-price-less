  <rect x="40" y="296" width="1060" height="184" rx="14" fill="#faf5ff" stroke="#ede9fe"/>
  <text class="band-label" x="1082" y="312" text-anchor="end">DOMAINS</text>
  <text class="box-file" x="1082" y="328" text-anchor="end">src/domains/ · orchestration</text>

  <rect x="56" y="340" width="270" height="100" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="box-label" x="191" y="372" text-anchor="middle">Command face</text>
  <text class="box-sub" x="191" y="394" text-anchor="middle">/task · /init · /optimize-prompt</text>
  <text class="box-file" x="191" y="424" text-anchor="middle">domains/commands.ts</text>

