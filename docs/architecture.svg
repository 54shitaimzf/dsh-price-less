  <text class="box-label" x="657" y="592" text-anchor="middle">Prompt optimizer</text>
  <text class="box-sub" x="657" y="614" text-anchor="middle">star input · 4 checks</text>
  <text class="box-file" x="657" y="644" text-anchor="middle">optimize.ts</text>

  <rect x="751" y="560" width="160" height="100" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text class="box-label" x="831" y="592" text-anchor="middle">Project brief</text>
  <text class="box-sub" x="831" y="614" text-anchor="middle">init capture · prefix</text>
  <text class="box-file" x="831" y="644" text-anchor="middle">init.ts · prefix.ts</text>

  <rect x="925" y="560" width="160" height="100" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text class="box-label" x="1005" y="592" text-anchor="middle">Ledger</text>
  <text class="box-sub" x="1005" y="614" text-anchor="middle">metrics · replayable</text>
  <text class="box-file" x="1005" y="644" text-anchor="middle">ledger/*</text>

  <rect x="55" y="684" width="500" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="box-sub" x="305" y="715" text-anchor="middle" fill="#475569">shear (R3) — slim tool results · paired cuts</text>

  <rect x="575" y="684" width="510" height="52" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="box-sub" x="830" y="715" text-anchor="middle" fill="#475569">compaction (R4) — history compression · two modes · hot-tail</text>

  <!-- ======================= BAND 4 · PLATFORM ======================= -->
  <rect x="40" y="812" width="1060" height="184" rx="14" fill="#f0fdf4" stroke="#dcfce7"/>
