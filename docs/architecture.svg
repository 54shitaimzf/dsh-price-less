  <text class="box-label" x="546" y="369" text-anchor="middle">Auto intent detection</text>
  <text class="box-sub" x="546" y="391" text-anchor="middle">explicit → rules → past verdicts → light model</text>
  <text class="box-sub" x="546" y="407" text-anchor="middle">gate: discriminator.auto (default: off)</text>
  <text class="box-file" x="546" y="429" text-anchor="middle">domains/input.ts</text>

  <rect x="765" y="340" width="270" height="100" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="box-label" x="900" y="372" text-anchor="middle" fill="#475569">Prompt optimizer · star</text>
  <text class="box-sub" x="900" y="394" text-anchor="middle">preview → confirm → backfill</text>
  <text class="box-file" x="900" y="424" text-anchor="middle">entry registered · flow = P14a/b</text>

