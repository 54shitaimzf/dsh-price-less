  <rect x="40" y="90" width="1060" height="170" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="band-label" x="58" y="116">USER / DEEPSEEK HARNESS HOST</text>

  <rect x="70" y="132" width="300" height="86" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="box-label" x="220" y="166" text-anchor="middle">User</text>
  <text class="box-sub" x="220" y="190" text-anchor="middle">slash commands · messages</text>

  <rect x="410" y="132" width="300" height="86" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="box-label" x="560" y="166" text-anchor="middle">DSH session</text>
  <text class="box-sub" x="560" y="190" text-anchor="middle">user/message · session/event firehose (H1)</text>

  <rect x="750" y="132" width="300" height="86" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="box-label" x="900" y="164" text-anchor="middle">Client UI</text>
  <text class="box-sub" x="900" y="186" text-anchor="middle">settings card · star-button shell</text>
  <text class="box-file" x="900" y="206" text-anchor="middle">field-model.ts (H8 / H11)</text>

